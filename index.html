      rel="stylesheet"
    />

    <!-- Single-Page Apps for GitHub Pages — restores the real URL after the
         404.html redirect so deep links (e.g. /journal/:id, /admin) work. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
